version: 2
updates:
  # The workflows are inline, so nothing else bumps their action pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A week of cooldown gives a compromised release time to be caught; security updates skip it.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # three 0.187 breaks postprocessing 6.39's render targets ("reading 'length'" in setupRenderTarget), so the 3D never draws.
    # Lift this when a postprocessing release supports it, and check the Studio's 3D by eye: the test suite has no WebGL.
    ignore:
      - dependency-name: "three"
        versions: [">=0.187.0"]
      - dependency-name: "@types/three"
        versions: [">=0.187.0"]
