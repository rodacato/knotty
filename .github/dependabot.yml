version: 2
updates:
  # The workflows are inline, so nothing else bumps their action pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A week of cooldown gives a compromised release time to be caught; security updates skip it.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
