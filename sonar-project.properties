sonar.projectKey=knotty
sonar.projectName=knotty
sonar.sourceEncoding=UTF-8

# Tests live beside the code, so the same tree is split by name.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Vitest measures only the code that makes decisions; the UI and the 3D are checked in the browser.
sonar.coverage.exclusions=src/adapters/**,src/ports/**,src/ui/**,src/*.ts,src/*.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
